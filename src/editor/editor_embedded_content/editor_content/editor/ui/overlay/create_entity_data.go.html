<!DOCTYPE html>
<html>
	<head>
		<style>
			body { z-index: 98; }
			.overlay {
				position: absolute;
				width: 35%;
				left: 50%;
				top: 50%;
				transform: translate(-50% -50%);
				color: white;
				border: 5px solid #575757;
				border-radius: 5px;
			}
			h1, p {
				text-align: center;
			}
			.btns {
				width: 100%;
				height: 2em;
				margin: 0.5em 0;
			}
			.confirm, .cancel {
				position: absolute;
				margin-left: 1em;
			}
			.confirm { left: 2em; }
			.cancel { right: 2em; }
			.inputPanel {
				position: relative;
				width: 100%;
				height: 2em;
				margin-bottom: 5px;
			}
			input {
				position: relative;
				height: 100%;
				color: #FFFFFF;
				background-color: #121212;
				font-size: 0.95em;
				font-family: inherit;
				outline: none;
				border: 1px solid #222224;
			}
			.fullWidth { width: 100%; }
			.folderInput { width: calc(100% - 7.5em); }
			.browseButton {
				position: absolute;
				right: 0;
				top: 0;
				width: 6.5em;
				height: 100%;
				background-color: #2A2A2C;
				border: 1px solid #3A3A3D;
				color: #E0E0E0;
				border-radius: 2px;
				font-size: 0.95em;
				font-weight: 500;
				font-family: inherit;
				cursor: pointer;
				transition: all 0.15s ease;
			}
			.browseButton:hover {
				background-color: #353538;
				border: 1px solid #5A5A5F;
				color: #FFFFFF;
			}
			#error { color: #C7655D; }
		</style>
	</head>
	<body>
		<div class="overlay edPanelBg">
			<h1>Create entity data</h1>
			<p>Create a POD entity data structure to bind to entities.</p>
			<div id="error">Error message...</div>
			<div class="fullWidth">
				<div class="inputPanel">
					<input id="nameInput" class="fullWidth" type="text" placeholder="Struct name..." />
				</div>
				<div class="inputPanel">
					<input id="folder" class="folderInput" type="text" placeholder="Folder..." />
					<button class="browseButton" onclick="browse">Browse...</button>
				</div>
			</div>
			<div class="btns">
				<button class="confirm" onclick="confirm">Create</button>
				<button class="cancel" onclick="cancel">Cancel</button>
			</div>
		</div>
	</body>
</html>
